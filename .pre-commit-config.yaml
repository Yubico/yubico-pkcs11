repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all -- --check
        pass_filenames: false
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --locked --workspace --all-targets
        pass_filenames: false
        files: '(\.rs$|(^|/)(Cargo\.toml|Cargo\.lock)$)'
      - id: cargo-deny
        name: cargo deny
        language: system
        entry: cargo deny --locked check
        pass_filenames: false
        files: '(^|/)(Cargo\.toml|Cargo\.lock|deny\.toml)$'

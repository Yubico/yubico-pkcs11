[workspace]
members = [
    "crates/pkcs11-sys",
    "crates/pkcs11-common",
    "crates/yubihsm-pkcs11",
    "crates/ykcs11",
]
resolver = "3"

[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1"
pkcs11-sys = { path = "crates/pkcs11-sys" }
pkcs11-common = { path = "crates/pkcs11-common" }
[workspace]
members = [
    "crates/pkcs11-sys",
    "crates/pkcs11-common",
    "crates/yubihsm-pkcs11",
    "crates/ykcs11",
]
resolver = "3"

[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1"
pkcs11-sys = { path = "crates/pkcs11-sys" }
pkcs11-common = { path = "crates/pkcs11-common" }

# Both modules are cdylibs loaded via dlopen/LoadLibrary by an external C
# caller (pkcs11-tool, or any PKCS#11 consumer) — never statically linked at
# process startup. Panicking across that FFI boundary is UB regardless of
# whether unwinding "works"; on Windows, a DLL loaded this way isn't
# guaranteed to have its exception-unwind tables registered the way a
# statically-linked one is, so attempting to unwind (even via catch_unwind
# inside a dependency, not just an uncaught panic) can itself crash rather
# than behave as a normal Rust panic would. panic = "abort" turns any panic
# into a clean process abort instead.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
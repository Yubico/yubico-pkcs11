[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Accepted existing risk: crypto-bigint 0.5 is required by the current elliptic-curve dependencies; resolving this needs a coordinated crypto dependency migration." },
    { id = "RUSTSEC-2023-0071", reason = "Accepted existing risk: rsa 0.9 has no patched release; review timing exposure before using host-side private-key operations." },
    { id = "RUSTSEC-2022-0004", reason = "Accepted existing risk: yubihsmrs depends on rustc-serialize; replacing its JSON parser requires upstream changes." },
    { id = "RUSTSEC-2025-0025", reason = "Accepted existing risk: yubihsmrs depends on unmaintained rustc-serialize; removal requires upstream changes." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "lowest-version"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Yubico/yubikey-manager.git",
    "https://github.com/Yubico/yubihsmrs.git",
]

[package]
name = "yubihsm-pkcs11"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "YubiHSM 2 PKCS#11 module"

[lib]
name = "yubihsm_pkcs11"
crate-type = ["cdylib", "staticlib"]

[dependencies]
pkcs11-sys = { workspace = true }
pkcs11-common = { workspace = true }
log = { workspace = true }
yubihsmrs = { git = "https://github.com/Yubico/yubihsmrs.git", branch = "pkcs11" }

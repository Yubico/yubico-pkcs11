[package]
name = "ykcs11"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "YubiKey PIV PKCS#11 module"

[lib]
name = "ykcs11"
# "rlib" is additive -- it doesn't change the cdylib/staticlib artifacts a
# real PKCS#11 consumer loads (see README.md), it's only here so
# crates/ykcs11/tests/*.rs integration tests can link against this crate's
# own `pub use dispatch::*` C ABI exports as plain Rust function calls
# (Cargo can't compile a test binary against a lib target that only emits
# cdylib/staticlib -- those aren't Rust-linkable formats).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pkcs11-sys = { workspace = true }
pkcs11-common = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
getrandom = "0.4"
der = "0.7"
x509-cert = { version = "0.2", features = ["builder"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa"] }
# "oid" is needed for ecdsa-core's `SignatureAlgorithmIdentifier` impl
# (x509-cert's CertificateBuilder needs it to self-sign the placeholder
# cert in generate.rs) -- not on by default, and p256's own "sha256"
# feature doesn't turn it on either.
sha2 = { version = "0.10", features = ["oid"] }
yubikit = { git = "https://github.com/Yubico/yubikey-manager.git", tag = "6.0.0-beta.0", default-features = false, features = ["pcsc"] }
# ML-DSA (FIPS 204) signature verification for CKM_ML_DSA (see verify.rs) --
# same version yubikit itself already pins as a dev-dependency for its own
# ML-DSA device tests.
ml-dsa = "0.1"
# ML-KEM (FIPS 203) host-side encapsulation for C_EncapsulateKey (see
# encapsulate.rs) -- same version yubikit itself already pins as a
# dev-dependency for its own ML-KEM device tests.
ml-kem = "0.3"

# Integration tests under tests/ don't automatically inherit the library's
# own [dependencies] -- pkcs11-sys is needed there too, to build raw
# CK_ATTRIBUTE/CK_* values for the real C_* calls those tests exercise.
[dev-dependencies]
pkcs11-sys = { workspace = true }

[lints]
workspace = true

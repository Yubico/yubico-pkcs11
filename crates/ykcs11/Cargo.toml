[package]
name = "ykcs11"
version = "2.8.0"
edition = "2024"
license = "BSD-2-Clause"
description = "YubiKey PIV PKCS#11 module"

[lib]
name = "ykcs11"
crate-type = ["cdylib", "staticlib"]

[dependencies]
pkcs11-sys = { workspace = true }
pkcs11-common = { workspace = true }
parking_lot = { workspace = true }
log = { workspace = true }
getrandom = "0.4"
yubikit = { git = "https://github.com/Yubico/yubikey-manager.git", branch = "experiment/rust", default-features = false, features = ["pcsc"] }

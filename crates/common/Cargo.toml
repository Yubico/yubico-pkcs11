[package]
name = "common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Shared PKCS#11 utilities for Yubico modules"

[dependencies]
pkcs11-sys = { workspace = true }
parking_lot = { workspace = true }
digest = { version = "0.11", features = ["alloc"] }
sha1 = "0.11"
sha2 = "0.11"
rsa = { version = "0.10", features = ["hazmat"] }
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek = "3"

[dev-dependencies]
crypto-bigint = "0.7"

[lints]
workspace = true

name: "ykcs11 - Build and test"

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:

  ubuntu:
    name: Build and test on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install PC/SC + bindgen build deps
        run: |
          sudo apt-get update

          sudo apt-get install -y libpcsclite-dev libclang-dev pcscd libudev-dev
          
          # C_GetSlotList talks to the PC/SC resource manager even with zero
          # readers attached — pcscd must actually be running or it fails
          # with CKR_DEVICE_ERROR (same as it would on a real machine).
          sudo systemctl start pcscd
          
          # for testing
          sudo apt-get install -y opensc

      - uses: dtolnay/rust-toolchain@stable

      - name: Build ykcs11
        run: |
          cargo build -p ykcs11 --verbose
          cargo test -p ykcs11
          
          test -f "target/debug/libykcs11.so" || { echo "::error::expected artifact target/debug/libykcs11.so was not produced"; exit 1; }
          pkcs11-tool --module target/debug/libykcs11.so --show-info | grep "PKCS#11 PIV Library"

  MacOS:
    name: Build and test on MacOS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest-large
            arch: amd
          - os: macos-latest-xlarge
            arch: arm

    steps:
      - name: clone repository
        uses: actions/checkout@v5

      - name: install dependencies
        run: |
          brew install opensc

      - uses: dtolnay/rust-toolchain@stable

      - name: Build ykcs11
        run: |
          cargo build -p ykcs11 --verbose
          cargo test -p ykcs11
          
          test -f "target/debug/libykcs11.dylib" || { echo "::error::expected artifact target/debug/libykcs11.dylib was not produced"; exit 1; }
          pkcs11-tool --module target/debug/libykcs11.dylib --show-info | grep "PKCS#11 PIV Library"

  Windows:
    name: Build and test on Windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
          - os: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build ykcs11
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = "Stop"
          
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          
          cargo build -p ykcs11 --verbose
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          
          cargo test -p ykcs11
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
                    
          Test-Path target/debug/ykcs11.dll -PathType Leaf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install OpenSC
        env:
          ARCH: ${{ matrix.arch }}

        run: |
          Set-PSDebug -Trace 1

          Invoke-WebRequest -Uri  https://github.com/OpenSC/OpenSC/releases/download/0.25.1/OpenSC-0.25.1_win64.msi -OutFile OpenSC.msi -UseBasicParsing

          Start-Sleep -Seconds 120
          $log = "$env:GITHUB_WORKSPACE\install_opensc.log"
          Start-Process "msiexec" "/i `"$env:GITHUB_WORKSPACE\OpenSC.msi`" /qn /l*! `"$log`"" -Wait -NoNewWindow -PassThru

      - name: Test ykcs11 module
        env:
          ARCH: ${{ matrix.arch }}

        run: |
          Set-PSDebug -Trace 1

          $env:PATH += ";C:\Program Files\OpenSC Project\OpenSC\tools"

          # C_GetSlotList calls into yubikit's PC/SC reader enumeration,
          # which talks to the Smart Card resource manager service even with
          # zero readers attached (same reason pcscd has to be running on
          # Linux). On a stock Windows Server CI image SCardSvr is
          # manual/trigger-start and that trigger doesn't always fire, so
          # start it explicitly rather than relying on that.
          Start-Service -Name SCardSvr
          Get-Service -Name SCardSvr | Format-List Name, Status, StartType

          # No PC/SC reader on this runner, so C_GetSlotList(NULL) legitimately
          # returns CKR_DEVICE_ERROR and pkcs11-tool exits non-zero — same
          # reason the Linux/macOS jobs above capture output and grep for a
          # known-good string instead of trusting the exit code. Treat
          # finding our manufacturer string in the output as success.
          $output = & pkcs11-tool.exe --module target/debug/ykcs11.dll --show-info 2>&1 | Out-String
          Write-Host $output

          if ($output.Contains("Yubico (www.yubico.com)")) {
            Write-Host "PASS: found expected manufacturer string"
            exit 0
          } else {
            Write-Host "FAIL: expected manufacturer string not found"
            exit 1
          }

